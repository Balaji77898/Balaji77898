<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
    <title id="title">Animated GitHub Profile Banner for BALAJI S</title>
    <desc id="desc">An animated background with the name BALAJI S, followed by the titles Backend Engineer and AI Enthusiast.</desc>

    <!-- Define the animated gradient background -->
    <defs>
        <linearGradient id="animatedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a202c">
                <animate attributeName="stop-color" values="#1a202c; #2d3748; #4a5568; #2d3748; #1a202c;" dur="10s" repeatCount="indefinite"></animate>
            </stop>
            <stop offset="100%" stop-color="#4a5568">
                <animate attributeName="stop-color" values="#4a5568; #2d3748; #1a202c; #2d3748; #4a5568;" dur="10s" repeatCount="indefinite"></animate>
            </stop>
        </linearGradient>
    </defs>

    <!-- Background rectangle filled with the animated gradient -->
    <rect x="0" y="0" width="800" height="200" fill="url(#animatedGradient)" />

    <!-- Main Text: BALAJI S -->
    <text
        x="50%"
        y="45%"
        dominant-baseline="middle"
        text-anchor="middle"
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="48"
        font-weight="bold"
        fill="#ffffff"
    >
        BALAJI S
    </text>

    <!-- Subtle glow effect for the main name to make it stand out -->
    <text
        x="50%"
        y="45%"
        dominant-baseline="middle"
        text-anchor="middle"
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="48"
        font-weight="bold"
        fill="none"
        stroke="#ffffff"
        stroke-width="0.5"
        opacity="0.5"
    >
        BALAJI S
    </text>

    <!-- Subtitle Text: Backend Engineer | AI Enthusiast -->
    <text
        x="50%"
        y="70%"
        dominant-baseline="middle"
        text-anchor="middle"
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20"
        fill="#cbd5e0"
        letter-spacing="1"
    >
        Backend Engineer  |  AI Enthusiast
    </text>
</svg>
